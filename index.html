<script>

  var root = document.getElementById('app');
  if(root && !root.children.length){
    root.innerHTML = '<div class="boot-error"><h1>FiskeDex lastes ikke riktig</h1><p>Last siden på nytt. Hvis det fortsatt er tomt, slett nettstedsdata/cache for fiskedex.no og prøv igjen.</p><button class="btn primary" onclick="location.reload()">Last inn på nytt</button></div>';
  }
});
</script>
